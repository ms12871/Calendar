<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Leap Year Checker</title>
	<style>
		:root {
			--ink: #17251f;
			--muted: #64736b;
			--paper: #f5f0e6;
			--panel: #fffdf8;
			--green: #176b52;
			--green-dark: #0f4b3a;
			--line: #d8d3c7;
			--coral: #c95f47;
		}

		* {
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 24px;
			color: var(--ink);
			background: var(--paper);
			font-family: Georgia, "Times New Roman", serif;
		}

		main {
			width: min(100%, 560px);
			padding: clamp(28px, 7vw, 56px);
			border: 1px solid var(--line);
			background: var(--panel);
			box-shadow: 12px 12px 0 var(--green);
		}

		.eyebrow {
			margin: 0 0 12px;
			color: var(--coral);
			font: 700 0.78rem/1.2 Arial, sans-serif;
			letter-spacing: 0.12em;
			text-transform: uppercase;
		}

		h1 {
			max-width: 380px;
			margin: 0;
			font-size: clamp(2.4rem, 8vw, 4.5rem);
			line-height: 0.95;
			font-weight: 400;
		}

		.intro {
			margin: 22px 0 30px;
			color: var(--muted);
			font: 1rem/1.6 Arial, sans-serif;
		}

		label {
			display: block;
			margin-bottom: 8px;
			font: 700 0.9rem/1.2 Arial, sans-serif;
		}

		.input-row {
			display: flex;
			gap: 10px;
		}

		input {
			min-width: 0;
			flex: 1;
			padding: 14px 16px;
			border: 2px solid var(--line);
			color: var(--ink);
			background: white;
			font: 1.1rem Arial, sans-serif;
		}

		input:focus {
			outline: 3px solid #b9d9cc;
			border-color: var(--green);
		}

		button {
			padding: 14px 18px;
			border: 0;
			color: white;
			background: var(--green);
			cursor: pointer;
			font: 700 0.95rem Arial, sans-serif;
		}

		button:hover {
			background: var(--green-dark);
		}

		button.secondary {
			margin-top: 12px;
			padding: 8px 0;
			color: var(--green-dark);
			background: transparent;
			text-decoration: underline;
		}

		.result {
			min-height: 76px;
			margin-top: 28px;
			padding: 16px;
			border-left: 4px solid var(--line);
			background: #f7f5ef;
			font: 1rem/1.5 Arial, sans-serif;
		}

		.result.success {
			border-left-color: var(--green);
		}

		.result.error {
			border-left-color: var(--coral);
		}

		.result-title {
			margin: 0 0 8px;
			font-size: 1.25rem;
		}

		.result-details {
			margin: 0;
			color: var(--muted);
			font-size: 0.9rem;
		}

		@media (max-width: 430px) {
			main {
				box-shadow: 7px 7px 0 var(--green);
			}

			.input-row {
				flex-direction: column;
			}
		}
	</style>
</head>
<body>
	<main>
		<p class="eyebrow">Calendar check</p>
		<h1>Is it a leap year?</h1>
		<p class="intro">Enter a year to find out whether February gets an extra day.</p>

		<form id="leap-form">
			<label for="year">Your year</label>
			<div class="input-row">
				<input id="year" name="year" type="number" min="1" step="1" placeholder="e.g. 2024" required>
				<button type="submit">Check year</button>
			</div>
			<button class="secondary" id="clear-button" type="button">Clear</button>
		</form>

		<div class="result" id="result" aria-live="polite">
			<p class="result-title">Your answer will appear here.</p>
		</div>
	</main>

	<script>
		const form = document.querySelector("#leap-form");
		const yearInput = document.querySelector("#year");
		const result = document.querySelector("#result");
		const clearButton = document.querySelector("#clear-button");

		const isLeapYear = (year) => year % 400 === 0 || (year % 4 === 0 && year % 100 !== 0);

		const findPreviousLeapYear = (year) => {
			for (let candidate = year - 1; candidate >= 1; candidate -= 1) {
				if (isLeapYear(candidate)) return candidate;
			}
			return null;
		};

		const findNextLeapYear = (year) => {
			let candidate = year + 1;
			while (!isLeapYear(candidate)) candidate += 1;
			return candidate;
		};

		form.addEventListener("submit", (event) => {
			event.preventDefault();
			const year = Number(yearInput.value);

			if (!Number.isInteger(year) || year < 1) {
				result.className = "result error";
				result.textContent = "Please enter a valid positive whole year.";
				return;
			}

			const leapYear = isLeapYear(year);
			const previousLeapYear = findPreviousLeapYear(year);
			const nextLeapYear = findNextLeapYear(year);
			const februaryDays = leapYear ? 29 : 28;
			const previousText = previousLeapYear
				? `Previous leap year: ${previousLeapYear}`
				: "No previous positive leap year";

			result.className = `result ${leapYear ? "success" : "error"}`;
			result.innerHTML = `
				<p class="result-title">${year} is ${leapYear ? "a" : "not a"} leap year.</p>
				<p class="result-details">February has ${februaryDays} days.<br>${previousText}<br>Next leap year: ${nextLeapYear}</p>
			`;
		});

		clearButton.addEventListener("click", () => {
			yearInput.value = "";
			result.className = "result";
			result.innerHTML = '<p class="result-title">Your answer will appear here.</p>';
			yearInput.focus();
		});
	</script>
</body>
</html>
