<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Leap Year Checker</title>
	<style>
		:root {
			--ink: #17251f;
			--muted: #64736b;
			--paper: #f5f0e6;
			--panel: #fffdf8;
			--green: #176b52;
			--green-dark: #0f4b3a;
			--line: #d8d3c7;
			--coral: #c95f47;
		}

		* {
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 24px;
			color: var(--ink);
			background: var(--paper);
			font-family: Georgia, "Times New Roman", serif;
		}

		main {
			width: min(100%, 560px);
			padding: clamp(28px, 7vw, 56px);
			border: 1px solid var(--line);
			background: var(--panel);
			box-shadow: 12px 12px 0 var(--green);
		}

		.eyebrow {
			margin: 0 0 12px;
			color: var(--coral);
			font: 700 0.78rem/1.2 Arial, sans-serif;
			letter-spacing: 0.12em;
			text-transform: uppercase;
		}

		h1 {
			max-width: 380px;
			margin: 0;
			font-size: clamp(2.4rem, 8vw, 4.5rem);
			line-height: 0.95;
			font-weight: 400;
		}

		.intro {
			margin: 22px 0 30px;
			color: var(--muted);
			font: 1rem/1.6 Arial, sans-serif;
		}

		label {
			display: block;
			margin-bottom: 8px;
			font: 700 0.9rem/1.2 Arial, sans-serif;
		}

		.input-row {
			display: flex;
			gap: 10px;
		}

		input {
			min-width: 0;
			flex: 1;
			padding: 14px 16px;
			border: 2px solid var(--line);
			color: var(--ink);
			background: white;
			font: 1.1rem Arial, sans-serif;
		}

		input:focus {
			outline: 3px solid #b9d9cc;
			border-color: var(--green);
		}

		button {
			padding: 14px 18px;
			border: 0;
			color: white;
			background: var(--green);
			cursor: pointer;
			font: 700 0.95rem Arial, sans-serif;
		}

		button:hover {
			background: var(--green-dark);
		}

		button.secondary {
			margin-top: 12px;
			padding: 8px 0;
			color: var(--green-dark);
			background: transparent;
			text-decoration: underline;
		}

		.result {
			min-height: 76px;
			margin-top: 28px;
			padding: 16px;
			border-left: 4px solid var(--line);
			background: #f7f5ef;
			font: 1rem/1.5 Arial, sans-serif;
		}

		.result.success {
			border-left-color: var(--green);
		}

		.result.error {
			border-left-color: var(--coral);
		}

		.result-title {
			margin: 0 0 8px;
			font-size: 1.25rem;
		}

		.result-details {
			margin: 0;
			color: var(--muted);
			font-size: 0.9rem;
		}

		.eid-section {
			margin-top: 28px;
			padding-top: 24px;
			border-top: 1px solid var(--line);
		}

		.eid-section h2 {
			margin: 0 0 6px;
			font-size: 1.35rem;
			font-weight: 400;
		}

		.eid-note {
			margin: 0 0 14px;
			color: var(--muted);
			font: 0.78rem/1.45 Arial, sans-serif;
		}

		.eid-table {
			width: 100%;
			border-collapse: collapse;
			font: 0.82rem/1.4 Arial, sans-serif;
		}

		.eid-table th,
		.eid-table td {
			padding: 9px 4px;
			border-bottom: 1px solid var(--line);
			text-align: left;
		}

		.eid-table th {
			color: var(--muted);
			font-size: 0.7rem;
			letter-spacing: 0.05em;
			text-transform: uppercase;
		}

		.eid-table td:first-child {
			font-weight: 700;
		}

		.eid-table tr.current-year {
			color: var(--green-dark);
			background: #eef5ef;
		}

		@media (max-width: 430px) {
			main {
				box-shadow: 7px 7px 0 var(--green);
			}

			.input-row {
				flex-direction: column;
			}
		}
	</style>
</head>
<body>
	<main>
		<p class="eyebrow">Calendar check</p>
		<h1>Is it a leap year?</h1>
		<p class="intro">Enter a year to find out whether February gets an extra day.</p>

		<form id="leap-form">
			<label for="year">Your year</label>
			<div class="input-row">
				<input id="year" name="year" type="number" min="1" step="1" placeholder="e.g. 2024" required>
				<button type="submit">Check year</button>
			</div>
			<button class="secondary" id="clear-button" type="button">Clear</button>
		</form>

		<div class="result" id="result" aria-live="polite">
			<p class="result-title">Your answer will appear here.</p>
		</div>

		<section class="eid-section" id="eid-section" hidden aria-labelledby="eid-title">
			<h2 id="eid-title">Eid dates</h2>
			<p class="eid-note">Calculated Gregorian dates using the Umm al-Qura calendar. Local moon-sighting announcements may differ by one day.</p>
			<table class="eid-table">
				<thead>
					<tr><th>Year</th><th>Eid al-Fitr</th><th>Eid al-Adha</th></tr>
				</thead>
				<tbody id="eid-dates"></tbody>
			</table>
		</section>
	</main>

	<script>
		const form = document.querySelector("#leap-form");
		const yearInput = document.querySelector("#year");
		const result = document.querySelector("#result");
		const clearButton = document.querySelector("#clear-button");
		const eidSection = document.querySelector("#eid-section");
		const eidDates = document.querySelector("#eid-dates");
		const islamicFormatter = new Intl.DateTimeFormat("en-u-ca-islamic-umalqura", {
			day: "numeric",
			month: "numeric",
			year: "numeric",
			timeZone: "UTC"
		});
		const dateFormatter = new Intl.DateTimeFormat("en", {
			day: "numeric",
			month: "short",
			year: "numeric",
			timeZone: "UTC"
		});

		const isLeapYear = (year) => year % 400 === 0 || (year % 4 === 0 && year % 100 !== 0);

		const findPreviousLeapYear = (year) => {
			for (let candidate = year - 1; candidate >= 1; candidate -= 1) {
				if (isLeapYear(candidate)) return candidate;
			}
			return null;
		};

		const findNextLeapYear = (year) => {
			let candidate = year + 1;
			while (!isLeapYear(candidate)) candidate += 1;
			return candidate;
		};

		const getEidDates = (year) => {
			const dates = {};
			const date = new Date(0);
			date.setUTCFullYear(year, 0, 1);
			date.setUTCHours(0, 0, 0, 0);

			for (let day = 0; day < 366; day += 1) {
				const parts = islamicFormatter.formatToParts(date);
				const month = Number(parts.find((part) => part.type === "month").value);
				const islamicDay = Number(parts.find((part) => part.type === "day").value);

				if (islamicDay === 1 && month === 10) dates.fitr = new Date(date);
				if (islamicDay === 10 && month === 12) dates.adha = new Date(date);
				date.setUTCDate(date.getUTCDate() + 1);
			}

			return dates;
		};

		const showEidDates = (year) => {
			const years = [year - 2, year - 1, year, year + 1, year + 2].filter((value) => value > 0);
			eidDates.innerHTML = years.map((dateYear) => {
				const dates = getEidDates(dateYear);
				const fitr = dates.fitr ? dateFormatter.format(dates.fitr) : "Unavailable";
				const adha = dates.adha ? dateFormatter.format(dates.adha) : "Unavailable";
				return `<tr class="${dateYear === year ? "current-year" : ""}"><td>${dateYear}</td><td>${fitr}</td><td>${adha}</td></tr>`;
			}).join("");
			eidSection.hidden = false;
		};

		form.addEventListener("submit", (event) => {
			event.preventDefault();
			const year = Number(yearInput.value);

			if (!Number.isInteger(year) || year < 1) {
				result.className = "result error";
				result.textContent = "Please enter a valid positive whole year.";
				return;
			}

			const leapYear = isLeapYear(year);
			const previousLeapYear = findPreviousLeapYear(year);
			const nextLeapYear = findNextLeapYear(year);
			const februaryDays = leapYear ? 29 : 28;
			const previousText = previousLeapYear
				? `Previous leap year: ${previousLeapYear}`
				: "No previous positive leap year";

			result.className = `result ${leapYear ? "success" : "error"}`;
			result.innerHTML = `
				<p class="result-title">${year} is ${leapYear ? "a" : "not a"} leap year.</p>
				<p class="result-details">February has ${februaryDays} days.<br>${previousText}<br>Next leap year: ${nextLeapYear}</p>
			`;
			showEidDates(year);
		});

		clearButton.addEventListener("click", () => {
			yearInput.value = "";
			result.className = "result";
			result.innerHTML = '<p class="result-title">Your answer will appear here.</p>';
			eidSection.hidden = true;
			eidDates.innerHTML = "";
			yearInput.focus();
		});
	</script>
</body>
</html>
